<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>
</head>
<body>

    <h2>Movie Ticket Booking</h2>
    <label for="numTickets">Number of Tickets:</label>
    <input type="number" id="numTickets">
    <br><br>
    <button onclick="calculateBooking()">Submit</button>

    <h3>Results</h3>
    <div id="output"></div>

    <script>
        function calculateBooking() {
            const fixedBudget = 20000;
            const ticketPrice = 400;
            const numTickets = parseInt(document.getElementById('numTickets').value) || 0;

            const totalCost = numTickets * ticketPrice;
            const remainingBudget = fixedBudget - totalCost;

            document.getElementById('output').innerHTML = `
                <p>Fixed Budget: $${fixedBudget}</p>
                <p>Ticket Price: $${ticketPrice}</p>
                <p>Total Cost of Tickets: $${totalCost}</p>
                <p>Remaining Budget: $${remainingBudget}</p>
            `;
        }
    </script>

</body>
</html>
